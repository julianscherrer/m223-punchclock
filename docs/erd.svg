<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">Punch Clock - Entity-Relationship-Diagramm</title>
  <desc id="description">ERD im UML-Klassenstil. PostgreSQL-Datenbank mit einer Tabelle entry. Sie enthält id als automatisch generierten Primärschlüssel sowie die Pflichtfelder checkIn und checkOut. Es bestehen keine Beziehungen zu anderen Tabellen.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d5e0dc" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#152b37" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#f3f6f2" />
  <rect width="1000" height="700" fill="url(#grid)" opacity="0.56" />
  <rect width="1000" height="9" fill="#127c73" />

  <text x="72" y="66" fill="#54716e" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PUNCH CLOCK  /  DATENMODELL</text>
  <text x="72" y="108" fill="#17333b" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Entity-Relationship-Diagramm</text>
  <text x="72" y="137" fill="#5b7275" font-family="Segoe UI, Arial, sans-serif" font-size="15">UML-Klassendiagramm des aktuellen relationalen Schemas</text>

  <g filter="url(#shadow)">
    <rect x="72" y="166" width="856" height="78" rx="6" fill="#ffffff" />
    <rect x="72" y="166" width="7" height="78" rx="3" fill="#127c73" />
  </g>
  <text x="98" y="192" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DATENBANK</text>
  <text x="98" y="222" fill="#17333b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">PostgreSQL</text>
  <line x1="300" y1="181" x2="300" y2="229" stroke="#d9e3df" />
  <text x="324" y="192" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SCHEMA</text>
  <text x="324" y="222" fill="#17333b" font-family="Consolas, monospace" font-size="16">public</text>
  <line x1="514" y1="181" x2="514" y2="229" stroke="#d9e3df" />
  <text x="538" y="192" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PERSISTENZ</text>
  <text x="538" y="222" fill="#17333b" font-family="Segoe UI, Arial, sans-serif" font-size="16">Hibernate ORM / JPA</text>
  <line x1="770" y1="181" x2="770" y2="229" stroke="#d9e3df" />
  <text x="794" y="192" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TABELLEN</text>
  <text x="794" y="222" fill="#17333b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">1</text>

  <g filter="url(#shadow)">
    <rect x="72" y="275" width="540" height="300" rx="6" fill="#ffffff" />
    <path d="M78 275h528a6 6 0 0 1 6 6v65H72v-65a6 6 0 0 1 6-6z" fill="#173d43" />
  </g>
  <text x="98" y="301" fill="#a8d7c8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">TABELLE</text>
  <text x="98" y="328" fill="#ffffff" font-family="Consolas, monospace" font-size="22" font-weight="700">entry</text>
  <text x="98" y="366" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SPALTE / JAVA-TYP</text>
  <text x="342" y="366" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">POSTGRESQL-TYP</text>
  <text x="490" y="366" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">EIGENSCHAFTEN</text>
  <line x1="88" y1="379" x2="596" y2="379" stroke="#d9e3df" />

  <text x="98" y="410" fill="#17333b" font-family="Consolas, monospace" font-size="15" font-weight="700">id</text>
  <text x="98" y="429" fill="#718381" font-family="Consolas, monospace" font-size="11">Long</text>
  <text x="342" y="418" fill="#405d60" font-family="Consolas, monospace" font-size="13">BIGINT</text>
  <rect x="482" y="395" width="40" height="23" rx="3" fill="#d8eee4" />
  <text x="502" y="411" text-anchor="middle" fill="#17624f" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">PK</text>
  <rect x="528" y="395" width="68" height="23" rx="3" fill="#e2edf0" />
  <text x="562" y="411" text-anchor="middle" fill="#365f68" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">IDENTITY</text>
  <line x1="88" y1="443" x2="596" y2="443" stroke="#edf1ee" />

  <text x="98" y="476" fill="#17333b" font-family="Consolas, monospace" font-size="15" font-weight="700">checkIn</text>
  <text x="98" y="495" fill="#718381" font-family="Consolas, monospace" font-size="11">LocalDateTime</text>
  <text x="342" y="484" fill="#405d60" font-family="Consolas, monospace" font-size="13">TIMESTAMP</text>
  <rect x="482" y="461" width="78" height="23" rx="3" fill="#fce8d8" />
  <text x="521" y="477" text-anchor="middle" fill="#955119" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">NOT NULL</text>
  <line x1="88" y1="509" x2="596" y2="509" stroke="#edf1ee" />

  <text x="98" y="542" fill="#17333b" font-family="Consolas, monospace" font-size="15" font-weight="700">checkOut</text>
  <text x="98" y="561" fill="#718381" font-family="Consolas, monospace" font-size="11">LocalDateTime</text>
  <text x="342" y="550" fill="#405d60" font-family="Consolas, monospace" font-size="13">TIMESTAMP</text>
  <rect x="482" y="527" width="78" height="23" rx="3" fill="#fce8d8" />
  <text x="521" y="543" text-anchor="middle" fill="#955119" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">NOT NULL</text>

  <g filter="url(#shadow)">
    <rect x="642" y="275" width="286" height="300" rx="6" fill="#ffffff" />
    <path d="M648 275h274a6 6 0 0 1 6 6v49H642v-49a6 6 0 0 1 6-6z" fill="#31585a" />
  </g>
  <text x="668" y="303" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Beziehungen</text>
  <text x="668" y="362" fill="#127c73" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">0 Fremdschlüssel</text>
  <text x="668" y="390" fill="#405d60" font-family="Segoe UI, Arial, sans-serif" font-size="13">Keine weiteren Entitäten</text>
  <text x="668" y="411" fill="#405d60" font-family="Segoe UI, Arial, sans-serif" font-size="13">oder Tabellen sind im aktuellen</text>
  <text x="668" y="432" fill="#405d60" font-family="Segoe UI, Arial, sans-serif" font-size="13">Datenmodell definiert.</text>
  <line x1="668" y1="455" x2="902" y2="455" stroke="#d9e3df" />
  <text x="668" y="482" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">KARDINALITÄT</text>
  <text x="668" y="508" fill="#17333b" font-family="Segoe UI, Arial, sans-serif" font-size="13">Keine Beziehungen vorhanden</text>
  <text x="668" y="544" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="11">Daher keine Beziehungs-Linien</text>
  <text x="668" y="560" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="11">oder Kardinalitäten einzuzeichnen.</text>

  <rect x="72" y="603" width="856" height="58" rx="5" fill="#e6eeea" />
  <text x="94" y="628" fill="#54716e" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">LEGENDE</text>
  <rect x="180" y="617" width="34" height="22" rx="3" fill="#d8eee4" />
  <text x="197" y="632" text-anchor="middle" fill="#17624f" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">PK</text>
  <text x="222" y="632" fill="#405d60" font-family="Segoe UI, Arial, sans-serif" font-size="12">Primärschlüssel</text>
  <rect x="369" y="617" width="67" height="22" rx="3" fill="#e2edf0" />
  <text x="402" y="632" text-anchor="middle" fill="#365f68" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">IDENTITY</text>
  <text x="444" y="632" fill="#405d60" font-family="Segoe UI, Arial, sans-serif" font-size="12">automatisch generiert</text>
  <rect x="627" y="617" width="75" height="22" rx="3" fill="#fce8d8" />
  <text x="664" y="632" text-anchor="middle" fill="#955119" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">NOT NULL</text>
  <text x="710" y="632" fill="#405d60" font-family="Segoe UI, Arial, sans-serif" font-size="12">Pflichtfeld</text>

  <text x="72" y="682" fill="#718381" font-family="Segoe UI, Arial, sans-serif" font-size="11">Abgeleitet aus der JPA-Entität Entry; Hibernate verwaltet das Schema mit der Strategie update.</text>
</svg>